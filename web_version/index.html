<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>손글씨 숫자 인식기</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 과제 요구사항: 학번과 이름이 화면 맨 위에 보여야 한다 -->
  <div class="학생정보">학번 2601922 &nbsp;·&nbsp; 이름 김루아</div>

  <header class="머리말">
    <h1>손글씨 숫자 인식기</h1>
    <p class="설명">검은 칸 안에 <strong>0부터 9까지</strong> 숫자 하나를 크고 두껍게 그려 보세요.
      손을 떼면 바로 인식합니다.</p>
  </header>

  <main class="본문">
    <section class="그림판칸">
      <canvas id="그림판" width="280" height="280" aria-label="숫자를 그리는 칸"></canvas>
      <div class="버튼줄">
        <button id="지우기단추" type="button" class="단추 보조">지우기</button>
        <button id="인식단추" type="button" class="단추 주요">인식하기</button>
      </div>
      <p id="안내문" class="안내문">모델을 불러오는 중입니다…</p>
    </section>

    <section class="결과칸">
      <div class="큰결과">
        <span id="예측숫자">?</span>
        <span id="확신도" class="확신도"></span>
      </div>

      <ol id="확률목록" class="확률목록"></ol>

      <div class="미리보기칸">
        <canvas id="전처리미리보기" width="28" height="28" aria-label="모델 입력 미리보기"></canvas>
        <p>모델이 실제로 보는 28×28 그림<br>(MNIST와 같게 가운데로 맞춘 결과)</p>
      </div>
    </section>
  </main>

  <footer class="꼬리말">
    <p>PyTorch로 학습한 CNN 가중치를 그대로 내보내, 브라우저에서 자바스크립트로 계산합니다.
      외부 라이브러리를 쓰지 않습니다.</p>
    <p><a href="https://github.com/kimlooa1004-blip/Study01_MNIST">깃허브 저장소 보기</a></p>
  </footer>

  <script src="cnn.js"></script>
  <script src="app.js"></script>
</body>
</html>
